[project]
name = "trackit_backend"
version = "0.1.0"
description = "This is the Backend of the TrackIT project"
authors = [
    {name = "Shouryan Bharote",email = "shouryanbharote888@gmail.com"}
]
license = "GNU v3"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "colorlog (>=6.10.1,<7.0.0)",
    "litellm (>=1.90.1,<2.0.0)"
    
]
[dependency-groups]
api = [

    ]
scraper = [
    "patchright (>=1.60.1,<2.0.0)"

    ]
dev = [

    ]
test = [
    "pytest (>=8.4.0,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
