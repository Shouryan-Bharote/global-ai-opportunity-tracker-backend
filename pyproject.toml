[project]
name = "trackit_backend"
version = "0.1.0"
description = "This is the Backend of the TrackIT project"
authors = [
    {name = "Shouryan Bharote",email = "shouryanbharote888@gmail.com"}
]
license = "GNU v3"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "colorlog (>=6.10.1,<7.0.0)",
    "litellm (>=1.90.1,<2.0.0)",
    "sqlmodel (>=0.0.14,<0.1.0)",
    "apscheduler (>=3.10.0,<4.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "psycopg2-binary (>=2.9.9,<3.0.0)",
    "patchright (>=1.60.1,<2.0.0)"
]
[dependency-groups]
api = [

    ]
scraper = [
    "patchright (>=1.60.1,<2.0.0)"

    ]
dev = [

    ]
test = [
    "pytest (>=8.4.0,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

